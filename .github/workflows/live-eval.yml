name: Live eval (OpenAI)

# Manual only: calls the real models in config/models.json and costs money.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case
        default: "3"

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx evals/run-live.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LIVE_RUNS: ${{ inputs.runs }}
      - run: npx tsx evals/run-refusals.ts --live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval-report
          path: |
            evals/reports/live-*
            evals/reports/refusals-live-*
